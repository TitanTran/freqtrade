services:
  freqtrade:
    # 1. ĐỔI IMAGE SANG PHIÊN BẢN RL (Có sẵn PyTorch)
    image: freqtradeorg/freqtrade:stable_freqai
    command: >
      trade 
      --config user_data/strategies/WolfStrategyV1/config.json 
      --strategy-path user_data/strategies/WolfStrategyV1 
      --strategy WolfStrategy 
      --freqaimodel XGBoostRegressor

    # (Các dòng volumes, ports... ở giữa giữ nguyên không đụng tới)
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"

    # 2. THÊM KHỐI DEPLOY ĐỂ THÔNG MẠCH CHO GPU RTX 4070 Ti
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
